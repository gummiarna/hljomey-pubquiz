<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hljómey Gítarpartý</title>
<meta name="description" content="Gítarpartý Hljómeyjar: spilarinn fær lögin með hljómum og allir hinir fylgjast með textanum í símanum.">
<meta name="theme-color" content="#15121f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Sömu litir og letur og í Pöbbkvissi og Tónlistarbingói (style.css) */
:root{
  --bg:#15121f; --panel:#2a2340; --panel2:#1f1a2e; --line:#3b3357;
  --text:#f6f3ff; --muted:#b3aacb; --accent:#ffb938; --accent-ink:#1b1300;
  --chord:#ffb938; --label:#b3aacb; --danger:#ef4d5a; --chorus:rgba(255,185,56,.07);
  --glow:#2c2250; --radius:14px; --fs:1;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f4ee; --panel:#ffffff; --panel2:#efeae0; --line:#ddd5c6;
  --text:#15121f; --muted:#5e5873; --accent:#c98400; --accent-ink:#ffffff;
  --chord:#a65f00; --label:#6b5f8a; --danger:#c43d2c; --chorus:rgba(201,132,0,.08);
  --glow:#efe6ff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(1200px 700px at 20% -10%,var(--glow) 0%,transparent 60%) no-repeat,var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hide{display:none!important}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ----- Takkar ----- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:15px;white-space:nowrap;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.big{min-height:56px;font-size:18px;padding:0 26px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:44px;height:44px;flex:0 0 44px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}

/* ----- Haus ----- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.12em}
.count{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-weight:600}
.count svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.live{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}

/* ----- Lag ----- */
.song{max-width:780px;margin:0 auto;padding:22px 20px 140px;font-size:calc(20px * var(--fs));line-height:1.42}
.song h1{font-size:1.45em;line-height:1.12;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.song .by{color:var(--muted);font-size:.72em;margin:0 0 1.2em;display:flex;flex-wrap:wrap;gap:4px 12px}
.song .by b{color:var(--text);font-weight:700}
.gp-blk{margin:0 0 1.05em}
.gp-chorus{background:var(--chorus);border-left:3px solid var(--accent);padding:.35em .7em .35em .75em;margin-left:-.75em;border-radius:0 10px 10px 0}
.gp-lbl{font-size:.6em;text-transform:uppercase;letter-spacing:.09em;color:var(--label);font-weight:700;margin:0 0 .3em}
.gp-rep .gp-lbl::before{content:"↻ "}
.gp-ln{min-height:1.42em;overflow-wrap:anywhere}
.gp-w{white-space:nowrap}
.gp-c{display:inline-block;position:relative;padding-top:1.08em;min-width:calc(var(--n,1) * .5em + .45em)}
.gp-c i{position:absolute;top:0;left:0;font-style:normal;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;font-size:.78em;line-height:1.35;color:var(--chord);white-space:nowrap}
.gp-only{display:flex;flex-wrap:wrap;gap:.15em 1.1em;margin:.15em 0}
.gp-only b{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78em;color:var(--chord)}
.gp-note{font-style:italic;color:var(--muted);font-size:.8em}
.chordsum{display:flex;flex-wrap:wrap;gap:6px;margin:-.4em 0 1.3em}
.chordsum span{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.62em;color:var(--chord);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* ----- Neðri stika ----- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .nav{width:56px;height:52px;flex:0 0 56px;border-radius:999px}
.dock .nav svg{width:26px;height:26px}
.tr{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel2);height:44px}
.tr button{width:38px;height:42px;border:0;background:none;font-size:20px;font-weight:700}
.tr span{min-width:44px;text-align:center;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;color:var(--chord)}
@media (max-width:440px){
  .dock{gap:6px}
  .dock .nav{width:48px;flex-basis:48px}
  .tr button{width:34px}
  .tr span{min-width:38px}
  .dock .pill{padding:0 12px}
}
.fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:22;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);padding:0}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fab b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--text);color:var(--bg);font-size:13px;line-height:22px;text-align:center;font-weight:900}
.fab.sing{bottom:max(16px,env(safe-area-inset-bottom))}
.has-banner .fab.sing{bottom:calc(88px + env(safe-area-inset-bottom))}
.bar .t.tap{background:none;border:0;text-align:left;padding:0;cursor:pointer}
.bar .t.tap b::after{content:" ▾";color:var(--muted);font-weight:500;font-size:.8em}
.row .played{color:var(--muted);font-size:13px;margin-right:6px}
.chiprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip i{font-style:normal;opacity:.7;font-size:12px}
.drawer .chips{padding:0 12px 10px}
.letter{font-size:13px;font-weight:900;color:var(--accent);letter-spacing:.06em;padding:14px 12px 4px;border-bottom:1px solid var(--line);margin:0 0 4px}
.drawer .letter{padding:12px 10px 4px}
.langtag{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.langtag.set{color:var(--accent);border-color:var(--accent)}
@media (max-width:440px){.btn.sq{padding:0 13px;min-width:46px}}
.sortbtn{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.banner{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:21;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:560px;margin:0 auto}
.banner p{margin:0;flex:1;font-size:14px;line-height:1.3}
.banner p b{display:block}

/* ----- Skúffa ----- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(420px,92vw);background:var(--panel2);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px}
.drawer header h2{flex:1;margin:0;font-size:18px}
.tabs{display:flex;gap:6px;padding:0 12px 10px}
.tabs button{flex:1;height:38px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.search{margin:0 12px 10px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);width:calc(100% - 24px);outline:none}
.search:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.list{flex:1;overflow:auto;padding:0 8px 24px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 10px;border-radius:12px;border:0;background:none;min-height:56px}
.row:hover{background:var(--bg)}
.row.cur{background:var(--panel)}
.row .n{width:28px;flex:0 0 28px;text-align:right;color:var(--muted);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--chord);font-weight:700}
.row .tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.row.now .n{color:var(--accent)}

/* ----- QR ----- */
.qr{position:fixed;inset:0;z-index:60;background:radial-gradient(1200px 700px at 20% -10%,#2c2250 0%,transparent 60%) no-repeat,#15121f;color:#f6f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.qr .box{background:#fff;border-radius:22px;padding:16px;width:min(78vw,62vh,520px);aspect-ratio:1}
.qr .box svg{width:100%;height:100%;display:block}
.qr h2{margin:0;font-size:clamp(24px,4vw,44px);font-weight:900}
.qr .c{font-size:clamp(48px,9vw,110px);font-weight:900;letter-spacing:.08em;line-height:1;color:#ffb938}
.qr p{margin:0;color:#b3aacb;font-size:clamp(14px,2vw,20px);word-break:break-all}
.qr .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;background:#1f1a2e;border-color:#3b3357;color:#f6f3ff}
.qr p b{color:#f6f3ff}

/* ----- Upphafssíða / söngbók ----- */
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 130px}
.hero{padding:26px 4px 18px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:.98;margin:12px 0 14px;font-weight:900;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:52ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.join{display:flex;gap:8px;align-items:center;margin:6px 0 22px}
.join input{flex:1;min-width:0;height:50px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 14px;font-size:22px;font-weight:700;letter-spacing:.3em;text-align:center;text-transform:uppercase;outline:none}
.join input:focus{border-color:var(--accent)}
.join input::placeholder{opacity:.35}
.join label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.sechead{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.sechead h2{flex:1;margin:0;font-size:18px}
.sechead .muted{color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 4px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;min-height:58px}
.pick:hover{background:var(--panel2)}
.pick input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 22px}
.pick .m{flex:1;min-width:0}
.pick .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .m small{display:block;color:var(--muted);font-size:13px}
.footer-cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.footer-cta .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.footer-cta .btn.primary{flex:1}
.resume{display:flex;align-items:center;gap:12px;margin-bottom:16px;border-color:var(--accent)}
.resume p{margin:0;flex:1;font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

/* ----- Söngbók: breyta ----- */
.brow{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;border-bottom:1px solid var(--line)}
.brow .m{flex:1;min-width:0}
.brow .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .m small{color:var(--muted);font-size:13px}
.brow .ib{width:38px;height:38px;flex-basis:38px;border-radius:10px}
.brow .ib svg{width:18px;height:18px}
.form{display:grid;gap:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:11px 12px;outline:none}
.field textarea{min-height:46vh;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;line-height:1.55;resize:vertical;white-space:pre;overflow:auto}
.cols{display:grid;grid-template-columns:1fr 110px 90px 170px;gap:10px}
@media (max-width:700px){.cols{grid-template-columns:1fr 1fr}}
.help{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.help code{font-family:"JetBrains Mono",monospace;color:var(--chord);font-size:12.5px}
.editgrid{display:grid;gap:18px}
@media (min-width:980px){
  .wrap.wide{max-width:1240px}
  .editgrid{grid-template-columns:1fr 1fr;align-items:start}
  .preview{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
  .mtabs{display:none!important}
}
@media (max-width:979px){ .editgrid[data-tab="text"] .preview{display:none} .editgrid[data-tab="preview"] .src{display:none} }
.preview{border:1px solid var(--line);border-radius:20px;background:var(--panel2)}
.preview .song{padding:18px 18px 28px;font-size:18px}
.hide-sm{display:inline}
@media (max-width:440px){.hide-sm{display:none}}
.imp-drop{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:28px 18px;border:2px dashed var(--line);border-radius:20px;background:var(--panel)}
.imp-drop.over{border-color:var(--accent)}
.imp-drop p{margin:0;color:var(--muted);max-width:44ch;line-height:1.5}
.imp-row{border-bottom:1px solid var(--line)}
.imp-row .pick{min-height:56px}
.imp-row .tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.imp-row .lb{background:none;border:0;color:var(--accent);font-weight:500;font-size:14px;padding:6px 8px}
.imp-prev{padding:0 12px 16px 46px}
.imp-prev .song{padding:0;font-size:16px}
.convert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--accent);font-size:14px;margin-top:8px}
.convert p{margin:0;flex:1}

/* ----- Prentun ----- */
.printbar{display:flex;gap:8px;align-items:center}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:max(4px,env(safe-area-inset-top))}
.brand{font-weight:900;letter-spacing:-.02em;font-size:20px}
.brand span{color:var(--accent)}
.modes{display:flex;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
.modes a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap}
.modes a.on{background:var(--accent);color:var(--accent-ink)}
.book{max-width:900px;margin:0 auto;padding:10px 20px 60px}
.book .pg{break-inside:avoid-page;margin:0 0 34px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.book .song{padding:0;font-size:15px;max-width:none}
.book .cover{text-align:center;padding:40px 0 30px}
.book .cover h1{font-size:40px;margin:0 0 6px}
.book .toc{columns:2;column-gap:28px;font-size:14px;padding:0;list-style:none;margin:20px 0 0}
.book .toc li{break-inside:avoid;padding:3px 0;border-bottom:1px dotted var(--line)}
@page{margin:16mm 15mm}
@media print{
  .book .toc{text-align:left}
  :root,:root[data-theme]{--bg:#fff;--panel:#fff;--panel2:#fff;--line:#ccc;--text:#000;--muted:#555;--accent:#0d6f64;--chord:#8a4500;--chorus:transparent;color-scheme:light}
  .bar,.dock,.footer-cta,.toast{display:none!important}
  .book{padding:0}
  .book .pg{border:0;break-before:page;margin:0}
  .book .cover{break-after:page}
  .book .song{font-size:12.5pt}
  .gp-chorus{background:none}
}

/* ----- Annað ----- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--panel2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));transform:translateY(calc(100% + 30px));visibility:hidden;transition:transform .22s ease,visibility 0s .22s;max-width:560px;margin:0 auto}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.drawer{visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.drawer.open{visibility:visible;transition:transform .22s ease}
.sheet h3{margin:0 0 14px;font-size:16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;padding:3px;gap:2px}
.seg button{border:0;background:none;height:38px;min-width:48px;padding:0 12px;font-weight:700;border-radius:999px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.center h2{margin:0;font-size:24px}
.center p{margin:0;color:var(--muted);max-width:38ch}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:700px){ .song{padding-top:30px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Lagalisti"></aside>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="gitar-core.js?v=2026-10-14g"></script>
<script>
(function () {
'use strict';
var G = window.GitarCore;
var esc = G.esc;
var app = document.getElementById('app');
var drawer = document.getElementById('drawer');
var scrim = document.getElementById('scrim');
var sheet = document.getElementById('sheet');

// ---------- Smáhlutir ----------
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem('gitar.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('gitar.' + k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('gitar.' + k); } catch (e) {} }
};
var SS = {
  get: function (k) { try { return sessionStorage.getItem('gitar.' + k); } catch (e) { return null; } },
  set: function (k, v) { try { sessionStorage.setItem('gitar.' + k, v); } catch (e) {} }
};
var I = {
  menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  qr: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 14h2M14 18v2M18 18h2v2"/></svg>',
  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4.1 4 1.6 4.5 4.3"/></svg>',
  aa: '<svg viewBox="0 0 24 24"><path d="M3 18l5-12 5 12M4.8 14h6.4M14 18l3.5-8 3.5 8M15.2 15.5h4.6"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  print: '<svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1h-2"/><rect x="7" y="14" width="10" height="6" rx="1"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>',
  guitar: '<svg viewBox="0 0 24 24"><path d="M19.5 4.5l-6 6"/><path d="M18 3l3 3"/><path d="M11.5 9.6c-1.6-.8-3.6-.6-4.8.6-.7.7-.9 1.6-1 2.4-.1.7-.6 1.1-1.3 1.3-.9.2-1.6.6-2 1.2-1 1.6-.2 4 1.8 5.6 2 1.6 4.4 1.9 5.6.6.5-.6.8-1.3.9-2.2.1-.7.5-1.2 1.2-1.3.9-.1 1.7-.4 2.4-1 1.2-1.2 1.4-3.2.6-4.8"/><circle cx="9" cy="15" r="1.4"/></svg>',
  scroll: '<svg viewBox="0 0 24 24"><path d="M12 4v13M6.5 11.5L12 17l5.5-5.5M6 20.5h12"/></svg>',
  upload: '<svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function errMsg(e) {
  var m = (e && (e.message || e.error_description)) || '';
  if (/rangt_pin|Rangt PIN/.test(m)) return 'Rangt PIN-númer.';
  if (/ogildur_spilari|stýrir ekki/.test(m)) return 'Þú stýrir ekki þessu partýi lengur.';
  if (/engin_log/.test(m)) return 'Veldu a.m.k. eitt lag.';
  if (/vantar_heiti/.test(m)) return 'Lagið þarf heiti.';
  if (/relation "?(public\.)?gitar_\w+"? does not exist|Could not find the table/.test(m)) return 'Gítarpartý er ekki uppsett í Supabase. Keyrðu gitar.sql.';
  if (/Could not find the function/.test(m)) return 'Vefsíðan og gagnagrunnurinn passa ekki saman: ' + m;
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Engin nettenging — reyndu aftur';
  return m || 'Eitthvað fór úrskeiðis';
}

// ---------- Þema ----------
function applyTheme() {
  var t = LS.get('theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  var light = t === 'light' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', light ? '#f7f4ee' : '#15121f');
}
// Partýið er sjálfgefið dökkt (kvöld!) nema notandi velji annað
if (LS.get('theme', null) === null) LS.set('theme', 'dark');
applyTheme();

// ---------- Gögn (Supabase) ----------
function supabaseData() {
  var pq = window.PQ;
  if (!pq || !pq.client || !pq.cfg || /XXXXXXXX/.test(pq.cfg.SUPABASE_URL || 'XXXXXXXX')) return null;
  var sb = pq.client;
  var tag = pq.cfg.EVENT_TAG || null;
  var cols = '*';   // allir dálkar (líka „lang" ef gitar.sql er uppfært)
  function un(r) { if (r.error) throw r.error; return r.data; }
  return {
    listSongs: function () { return sb.from('gitar_songs').select(cols).order('sort_order').order('title').then(un); },
    songsByIds: function (ids) { return ids.length ? sb.from('gitar_songs').select(cols).in('id', ids).then(un) : Promise.resolve([]); },
    check: function (p) { return sb.rpc('gitar_check', { p_pin: p }).then(un); },
    saveSong: function (p, s) {
      var args = { p_pin: p, p_id: s.id || null, p_title: s.title, p_artist: s.artist || '', p_body: s.body || '', p_key: s.song_key || '', p_capo: s.capo || 0 };
      var withLang = Object.assign({ p_lang: s.lang || null }, args);
      return sb.rpc('gitar_save_song', withLang).then(un).catch(function (e) {
        // Gagnagrunnur án flokka (gitar.sql ekki uppfært): vista án flokks
        if (/Could not find the function|p_lang/i.test((e && e.message) || '')) { S.noLang = true; return sb.rpc('gitar_save_song', args).then(un); }
        throw e;
      });
    },
    deleteSong: function (p, id) { return sb.rpc('gitar_delete_song', { p_pin: p, p_id: id }).then(un); },
    reorder: function (p, ids) { return sb.rpc('gitar_reorder', { p_pin: p, p_ids: ids }).then(un); },
    start: function (ids) { return sb.rpc('gitar_start', { p_song_ids: ids, p_event_tag: tag }).then(un); },
    set: function (code, token, song, tr, ids) { return sb.rpc('gitar_set', { p_code: code, p_token: token, p_song: song, p_tr: tr, p_song_ids: ids || null }).then(un); },
    isHost: function (code, token) { return sb.rpc('gitar_is_host', { p_code: code, p_token: token }).then(un); },
    getSession: function (code) { return sb.from('gitar_sessions').select('code,song_ids,current_song,transpose').eq('code', code).maybeSingle().then(un); },
    live: function (code, role, h) {
      var ch = sb.channel('gitar-' + code, { config: { presence: { key: role + '-' + Math.random().toString(36).slice(2, 10) } } });
      ch.on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gitar_sessions', filter: 'code=eq.' + code }, function (p) { h.state(p.new); })
        .on('presence', { event: 'sync' }, function () {
          var keys = Object.keys(ch.presenceState());
          h.count(keys.filter(function (k) { return k.indexOf('s-') === 0; }).length);
        })
        .subscribe(function (status) {
          h.status(status);
          if (status === 'SUBSCRIBED') ch.track({ r: role });
        });
      return function () { sb.removeChannel(ch); };
    }
  };
}
var D = window.GitarDataMock || supabaseData();

// ---------- Staða ----------
var S = {
  view: '',
  book: [],
  songs: {},
  setlist: [],
  code: null, token: null,
  cur: null, hostSong: null, hostTr: 0,
  tr: 0, trBy: {},
  follow: true,
  singers: 0, online: false,
  sel: null,
  chords: true,
  pass: SS.get('pass'),
  unlive: null,
  drawerTab: 'set',
  q: '',
  sort: LS.get('sort', 'order'),
  langf: LS.get('langf', 'all'),
  played: {}
};

function parsed(song) {
  if (!song) return null;
  if (!song._p || song._pb !== song.body) { song._p = G.parseSong(song.body); song._pb = song.body; }
  if (song.song_key) song._p.meta.key = song.song_key;
  return song._p;
}
function addSongs(list) { list.forEach(function (s) { S.songs[s.id] = s; }); }
function songTitle(id) { var s = S.songs[id]; return s ? s.title : ''; }

var params = new URLSearchParams(location.search);
function setUrl(q) { try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) {} }
function joinUrl(code) {
  var base = location.origin + location.pathname;
  return base + (base.indexOf('?') === -1 ? '?' : '&') + 'k=' + code;
}

// ---------- Skjár haldist kveiktur ----------
var wake = null;
function keepAwake() {
  if (!('wakeLock' in navigator) || wake) return;
  navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    if (S.view === 'host' || S.view === 'sing') keepAwake();
    if (S.view === 'sing' && S.code) refreshSession();
  }
});

// ---------- Lag ----------
function songHead(song, tr, showChords) {
  var p = parsed(song);
  var key = G.songKey(p, tr);
  var bits = [];
  if (song.artist) bits.push('<span>' + esc(song.artist) + '</span>');
  if (showChords && key) bits.push('<span>Tóntegund <b class="mono">' + esc(key) + '</b></span>');
  if (showChords && song.capo) bits.push('<span>Capó <b>' + song.capo + '</b></span>');
  var html = '<h1>' + esc(song.title) + '</h1>' + (bits.length ? '<p class="by">' + bits.join('') + '</p>' : '');
  if (showChords) {
    var cl = G.chordList(p, tr);
    if (cl.length) html += '<div class="chordsum">' + cl.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>';
  }
  return html;
}
function songBody(song, tr, showChords) {
  return G.renderSong(parsed(song), { chords: showChords, tr: tr }).replace(/<div class="gp-lbl">([^<]*)<\/div>/g, function (m, l) {
    return '<div class="gp-lbl">' + esc(labelIs(l)) + '</div>';
  });
}
var LABELS = { verse: 'Erindi', chorus: 'Viðlag', 'pre-chorus': 'Forviðlag', prechorus: 'Forviðlag', bridge: 'Brú', intro: 'Forspil', outro: 'Eftirspil', solo: 'Sóló', interlude: 'Millispil', instrumental: 'Spil', 'post-chorus': 'Eftirviðlag', hook: 'Viðlag', refrain: 'Viðlag' };
function labelIs(l) {
  var raw = l.replace(/&amp;/g, '&');
  var m = /^([a-z\- ]+?)\s*(\d*)$/i.exec(raw.trim());
  if (m && LABELS[m[1].toLowerCase()]) return LABELS[m[1].toLowerCase()] + (m[2] ? ' ' + m[2] : '');
  return raw;
}
var FS = 1;
function setFs() { FS = +LS.get('fs', 1) || 1; document.documentElement.style.setProperty('--fs', FS); }
setFs();

// ---------- Sjálfvirkt skrun (hraði 1, 2, 3) ----------
var SCR = { v: 0, raf: 0, t: 0, y: 0, hold: false };
var SPEED = [0, 9, 16, 26];   // punktar á sekúndu við venjulega leturstærð, án hljóma
function fabHTML(cls) {
  return '<button class="fab ' + (cls || '') + (SCR.v ? ' on' : '') + '" data-act="scroll" aria-label="Sjálfvirkt skrun' + (SCR.v ? ', hraði ' + SCR.v : ', slökkt') + '">' + I.scroll + (SCR.v ? '<b>' + SCR.v + '</b>' : '') + '</button>';
}
function updFab() {
  var f = app.querySelector('.fab'); if (!f) return;
  f.classList.toggle('on', !!SCR.v);
  f.innerHTML = I.scroll + (SCR.v ? '<b>' + SCR.v + '</b>' : '');
  f.setAttribute('aria-label', 'Sjálfvirkt skrun' + (SCR.v ? ', hraði ' + SCR.v : ', slökkt'));
}
function setScroll(v) {
  SCR.v = v; SCR.t = 0; SCR.y = window.scrollY;
  cancelAnimationFrame(SCR.raf);
  if (v) { keepAwake(); SCR.raf = requestAnimationFrame(scrollTick); }
  updFab();
}
function scrollTick(ts) {
  if (!SCR.v) return;
  var dt = SCR.t ? Math.min(0.1, (ts - SCR.t) / 1000) : 0;
  SCR.t = ts;
  if (!SCR.hold && !document.hidden && dt) {
    if (Math.abs(window.scrollY - SCR.y) > 3) SCR.y = window.scrollY;   // notandi skrunaði sjálfur
    SCR.y += SPEED[SCR.v] * FS * (S.chords ? 1.6 : 1) * dt;
    window.scrollTo(0, SCR.y);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (SCR.y >= max - 1) { setScroll(0); return; }   // komið á enda lagsins
  }
  SCR.raf = requestAnimationFrame(scrollTick);
}
document.addEventListener('touchstart', function () { SCR.hold = true; }, { passive: true });
document.addEventListener('touchend', function () { SCR.hold = false; SCR.y = window.scrollY; }, { passive: true });
document.addEventListener('touchcancel', function () { SCR.hold = false; SCR.y = window.scrollY; }, { passive: true });

// ---------- Flokkar og röðun ----------
var LANGN = { is: 'Íslenskt', erl: 'Erlent' };
function langOf(s) {
  if (s._lgB !== s.body || s._lgL !== s.lang) { s._lg = G.songLang(s); s._lgB = s.body; s._lgL = s.lang; }
  return s._lg;
}
// Sía eftir flokki og leit, raða eftir stafrófi eða röð söngbókar
function viewList(songs) {
  var q = S.q.trim().toLowerCase();
  var out = songs.filter(function (s) {
    if (!s) return false;
    if (S.langf !== 'all' && langOf(s) !== S.langf) return false;
    return !q || (s.title + ' ' + (s.artist || '')).toLowerCase().indexOf(q) !== -1;
  });
  if (S.sort === 'abc') out = out.slice().sort(function (a, b) { return G.compareTitles(a.title, b.title); });
  return out;
}
function sortedAll(songs) {
  return S.sort === 'abc' ? songs.slice().sort(function (a, b) { return G.compareTitles(a.title, b.title); }) : songs.slice();
}
function withLetters(list, rowFn) {
  var last = null;
  return list.map(function (s, i) {
    var h = '';
    if (S.sort === 'abc') { var L = G.initialOf(s.title); if (L !== last) { h = '<div class="letter">' + esc(L) + '</div>'; last = L; } }
    return h + rowFn(s, i);
  }).join('');
}
function langChips(songs) {
  var nis = songs.filter(function (s) { return s && langOf(s) === 'is'; }).length;
  var all = songs.filter(Boolean).length;
  return '<div class="chips" role="group" aria-label="Flokkur">' +
    [['all', 'Öll', all], ['is', 'Íslensk', nis], ['erl', 'Erlend', all - nis]].map(function (o) {
      return '<button class="chip' + (S.langf === o[0] ? ' on' : '') + '" data-act="langf" data-v="' + o[0] + '">' + o[1] + ' <i>' + o[2] + '</i></button>';
    }).join('') + '</div>';
}
function sortChips() {
  return '<div class="chips" role="group" aria-label="Röðun">' +
    [['order', 'Röð'], ['abc', 'A–Ö']].map(function (o) {
      return '<button class="chip' + (S.sort === o[0] ? ' on' : '') + '" data-act="sortv" data-v="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
}

// ---------- Skúffa (lagalisti) ----------
function openDrawer() { renderDrawer(); drawer.classList.add('open'); scrim.classList.add('open'); var s = drawer.querySelector('.search'); if (s && matchMedia('(pointer:fine)').matches) s.focus(); var c = drawer.querySelector('.row.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
function closeDrawer() { drawer.classList.remove('open'); if (!sheet.classList.contains('open')) scrim.classList.remove('open'); }
function openSheet(html) { sheet.innerHTML = html; sheet.classList.add('open'); scrim.classList.add('open'); }
function closeSheet() { sheet.classList.remove('open'); if (!drawer.classList.contains('open')) scrim.classList.remove('open'); }
scrim.addEventListener('click', function () { closeDrawer(); closeSheet(); });

function renderDrawer() {
  var host = S.view === 'host';
  var tab = host ? S.drawerTab : 'set';
  var pool = (tab === 'set' ? S.setlist : S.book.map(function (s) { return s.id; })).map(function (id) { return S.songs[id]; }).filter(Boolean);
  var rows = withLetters(viewList(pool), function (s) {
    var id = s.id;
    var inSet = S.setlist.indexOf(id) !== -1;
    var cls = 'row' + (id === S.cur ? ' cur' : '') + (S.view === 'sing' && id === S.hostSong ? ' now' : '');
    var right = '';
    if (S.view === 'sing' && id === S.hostSong) right = '<span class="tag">Núna</span>';
    else if (tab === 'all' && !inSet) right = '<span class="tag">+ Bæta við</span>';
    else if (host) right = (S.played[id] && id !== S.cur ? '<span class="played" title="Búið að spila">✓</span>' : '') + '<span class="k">' + esc(G.songKey(parsed(s), 0)) + '</span>';
    return '<button class="' + cls + '" data-act="pick" data-id="' + id + '"><span class="n">' + (tab === 'set' ? (S.setlist.indexOf(id) + 1) : (inSet ? '✓' : '')) + '</span><span class="m"><b>' + esc(s.title) + '</b>' + (s.artist ? '<small>' + esc(s.artist) + '</small>' : '') + '</span>' + right + '</button>';
  });
  drawer.innerHTML =
    '<header><h2>' + (host ? 'Lög' : 'Lagalisti') + '</h2><button class="sortbtn" data-act="sort" title="Raða">' + (S.sort === 'abc' ? 'A–Ö' : 'Röð') + '</button><button class="ib" data-act="close-drawer" aria-label="Loka">' + I.x + '</button></header>' +
    (host ? '<div class="tabs"><button data-act="dtab" data-tab="set" class="' + (tab === 'set' ? 'on' : '') + '">Í kvöld (' + S.setlist.length + ')</button><button data-act="dtab" data-tab="all" class="' + (tab === 'all' ? 'on' : '') + '">Öll lög (' + S.book.length + ')</button></div>' : '') +
    langChips(pool) +

function markPlayed(id) {

function hostGo(id, keepScroll) {
  if (!S.songs[id]) return;
  var added = null;
  if (S.setlist.indexOf(id) === -1) { S.setlist = S.setlist.concat([id]); added = S.setlist; }
  S.cur = id;
  S.tr = S.trBy[id] || 0;
  markPlayed(id);
  if (!keepScroll) setScroll(0);
  renderHost();
  if (!keepScroll) window.scrollTo(0, 0);
  push(added);
}
function push(ids) {
  var code = S.code, tok = S.token, song = S.cur, tr = S.tr;
  D.set(code, tok, song, tr, ids).catch(function (e) {
    setTimeout(function () {
      if (S.cur !== song || S.tr !== tr) return;
      D.set(code, tok, song, tr, ids).catch(function (e2) { toast(errMsg(e2) === 'Eitthvað fór úrskeiðis' ? 'Náði ekki að senda á símana' : errMsg(e2)); });
    }, 900);
  });
}
var trTimer = null;
function hostTr(d) {
  S.tr = Math.max(-11, Math.min(11, S.tr + d));
  if (S.tr === 12 || S.tr === -12) S.tr = 0;
  S.trBy[S.cur] = S.tr;
  renderHost();
  clearTimeout(trTimer);
  trTimer = setTimeout(function () { push(null); }, 350);
}

function joinParty(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  S.view = 'loading';
  closeDrawer();
  app.innerHTML = '<div class="center"><div class="spin"></div><p>Tengist partýi…</p></div>';
  if (code.length !== 4) return renderNoParty('');
  D.getSession(code).then(function (sess) {
    if (!sess) return renderNoParty(code);
    S.code = code;
    return D.songsByIds(sess.song_ids || []).then(function (list) {
      addSongs(list);
      S.setlist = (sess.song_ids || []).filter(function (id) { return S.songs[id]; });
      S.hostSong = sess.current_song; S.hostTr = sess.transpose || 0;
      S.cur = S.hostSong || S.setlist[0]; S.tr = S.hostTr;
      S.lastKey = stateKey(sess);
      S.follow = true;
      S.chords = LS.get('chords.sing', false);
      S.view = 'sing';
      setUrl('k=' + code);
      goLive('s');
      renderSing();
      keepAwake();
    });
  }).catch(function (e) {
    app.innerHTML = '<div class="center"><h2>Næ ekki sambandi</h2><p>' + esc(errMsg(e)) + '</p><button class="btn" data-act="rejoin">Reyna aftur</button></div>';
  });
}

    '<a class="linkbtn" href="./">Á forsíðu</a><button class="linkbtn" data-act="home">Ég er spilarinn →</button></div>';

function renderSing() {
  var song = S.songs[S.cur];
  if (!song) {
    app.innerHTML = '<div class="center"><div class="spin"></div><p>Bíð eftir spilaranum…</p></div>';
    return;
  }
  var tr = S.cur === S.hostSong ? S.hostTr : 0;
  var off = !S.follow && S.hostSong && S.hostSong !== S.cur && S.songs[S.hostSong];
  app.innerHTML =
    '<header class="bar">' +
      '<button class="ib" data-act="drawer" aria-label="Lagalisti">' + I.menu + '</button>' +
      '<button class="t tap" data-act="drawer" title="Lagalisti"><b>' + esc(song.title) + '</b><small><span class="live' + (S.online ? ' ok' : '') + '"></span> ' + (S.follow ? 'Fylgir spilaranum' : 'Þú flettir sjálf/ur') + '</small></button>' +
      '<button class="pill' + (S.chords ? ' on' : '') + '" data-act="chords"><span class="dot"></span>Hljómar</button>' +
      '<button class="ib" data-act="settings" aria-label="Stillingar">' + I.aa + '</button>' +
    '</header>' +

    (off ? '<div class="banner"><p><b>Spilarinn er á öðru lagi</b>' + esc(songTitle(S.hostSong)) + '</p><button class="btn primary" data-act="follow">Fylgja</button></div>' : '') +
    fabHTML('sing');
  document.body.classList.toggle('has-banner', !!off);
}
function stateKey(st) { return [st.current_song, st.transpose || 0, (st.song_ids || []).join(',')].join('|'); }
function onState(st) {
  if (!st || st.code !== S.code) return;
  if (S.view === 'sing') {
    var key = stateKey(st);
    if (key === S.lastKey) return;   // ekkert breyttist
    S.lastKey = key;
    var prevSong = S.hostSong;
    S.hostSong = st.current_song; S.hostTr = st.transpose || 0;
    var ids = st.song_ids || S.setlist;
    var missing = ids.filter(function (id) { return !S.songs[id]; });
    var apply = function () {
      S.setlist = ids.filter(function (id) { return S.songs[id]; });
      if (S.follow) {
        var changed = S.cur !== S.hostSong;
        S.cur = S.hostSong;
        if (changed) setScroll(0);
        renderSing();
        if (changed) window.scrollTo(0, 0);
      } else if (prevSong !== S.hostSong) renderSing();
      else renderSing();
      if (drawer.classList.contains('open')) renderDrawer();
    };
    if (missing.length) D.songsByIds(missing).then(function (l) { addSongs(l); apply(); }).catch(apply);
    else apply();
  }
}
function refreshSession() {
  D.getSession(S.code).then(function (st) { if (st) onState(st); }).catch(function () {});
}
// Öryggisnet ef rauntími missir af breytingu (eins og í kvissinu)

function goLive(role) {
  if (S.unlive) S.unlive();
  S.online = false; S.singers = 0;
  var first = true;
  S.unlive = D.live(S.code, role, {
    state: onState,
    count: function (n) {
      S.singers = n;
      var c = document.getElementById('cnt'); if (c) c.textContent = n;

    status: function (st) {
      var was = S.online;

      document.querySelectorAll('.live').forEach(function (d) { d.classList.toggle('ok', S.online); });
      // Eftir endurtengingu: sækja nýjustu stöðu (gætum hafa misst af breytingu)
      if (S.online && !was && role === 's' && !first) refreshSession();
      if (S.online) first = false;
    }
  });
}

var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var IMP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function (res, rej) {
    var sc = document.createElement('script');
    sc.src = PDFJS + 'pdf.min.js';
    sc.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror = function () { rej(new Error('Náði ekki í PDF-lesarann. Athugaðu nettenginguna.')); };
    document.head.appendChild(sc);
  });
}
var mctx = null, mfont = '';
function measure(str, size) {
  if (!mctx) mctx = document.createElement('canvas').getContext('2d');
  var f = size.toFixed(2) + 'px Helvetica, Arial, "Liberation Sans", sans-serif';
  if (f !== mfont) { mctx.font = f; mfont = f; }
  return mctx.measureText(str).width;
}
function readPdf(file) {
  return loadPdfJs().then(function (pdfjs) {
    return file.arrayBuffer().then(function (buf) { return pdfjs.getDocument({ data: buf }).promise; });
  }).then(function (doc) {
    var pages = [], n = 0;
    function next() {
      n++;
      if (n > doc.numPages) return Promise.resolve(pages);
      var width = 0;
      return doc.getPage(n).then(function (pg) { width = pg.view[2] - pg.view[0]; return pg.getTextContent(); }).then(function (tc) {
        pages.push({ width: width, items: tc.items.filter(function (i) { return typeof i.str === 'string'; }).map(function (i) {
          var t = i.transform;
          return { str: i.str, x: t[4], y: t[5], w: i.width, size: Math.hypot(t[2], t[3]) || Math.abs(t[0]), font: i.fontName };
        }) });
        return next();
      });
    }
    return next();
  });
}
function renderImport() {
  S.view = 'import';
  IMP = null;
  app.innerHTML =
    '<header class="bar"><button class="ib" data-act="imp-back" aria-label="Til baka">' + I.back + '</button><div class="t"><b>Flytja inn lög</b><small>Úr PDF-söngbók</small></div></header>' +
    '<div class="wrap" style="padding-top:18px"><label class="imp-drop" id="drop">' + I.upload.replace('<svg', '<svg style="width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"') +
      '<b style="font-size:18px">Veldu PDF-söngbók</b>' +
      '<p>T.d. söngbók sem þú bjóst til á guitarparty.com. Skráin er lesin í vafranum þínum, hljómarnir settir á rétt atkvæði og þú velur hvaða lög fara í söngbókina.</p>' +
      '<span class="btn primary">Velja skrá</span><input type="file" accept="application/pdf,.pdf" data-inp="pdf" hidden></label>' +
      '<div id="impout"></div></div>';
  var drop = document.getElementById('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) importFile(f); });
}
function importFile(file) {
  var out = document.getElementById('impout');
  out.innerHTML = '<div class="center" style="min-height:30vh"><div class="spin"></div><p>Les ' + esc(file.name) + '…</p></div>';
  if (typeof G.fromPdfPages !== 'function') {
    out.innerHTML = '<div class="empty"><b>Gömul útgáfa af gitar-core.js</b>Hladdu nýju gitar-core.js upp í pubquiz-möppuna og endurhlaðaðu síðuna.</div>';
    return;
  }
  readPdf(file).then(function (pages) {
    var songs = G.fromPdfPages(pages, measure);
    var have = {};
    S.book.forEach(function (b) { have[b.title.trim().toLowerCase()] = b.id; });
    IMP = songs.map(function (sg, i) {
      var ex = have[sg.title.trim().toLowerCase()] || null;
      return { i: i, title: sg.title, artist: sg.artist, body: sg.body, exists: ex, sel: !ex, open: false };
    });
    renderImportList();
  }).catch(function (e) {
    out.innerHTML = '<div class="empty"><b>Gat ekki lesið skrána</b>' + esc(e && e.message || '') + '</div>';

function renderImportList() {

  if (!IMP.length) { out.innerHTML = '<div class="empty"><b>Engin lög fundust</b>Þetta lítur ekki út eins og söngbók með hljómum.</div>'; return; }

    (nex ? '<p class="help" style="margin:-4px 0 12px">' + nex + ' lög eru þegar í söngbókinni og eru ekki valin. Hakaðu við þau til að <b>skipta gömlu útgáfunni út</b> fyrir þessa.</p>' : '') +
    IMP.map(function (x) {
      return '<div class="imp-row"><label class="pick"><input type="checkbox" data-imp="' + x.i + '"' + (x.sel ? ' checked' : '') + '>' +
        '<span class="m"><b>' + esc(x.title) + '</b>' + (x.artist ? '<small>' + esc(x.artist) + '</small>' : '') + '</span>' +
        (x.exists ? '<span class="tag" data-ex="' + x.i + '">' + (x.sel ? 'Skipt út' : 'Er þegar til') + '</span>' : '') +
        '<button class="lb" data-act="imp-prev" data-i="' + x.i + '">' + (x.open ? 'Fela' : 'Skoða') + '</button></label>' +
        (x.open ? '<div class="imp-prev"><div class="song chords-on"><div class="gp">' + G.renderSong(G.parseSong(x.body), { chords: true }) + '</div></div></div>' : '') +
        '</div>';
    }).join('') +
    '<div class="footer-cta"><div class="in"><button class="btn primary big" data-act="imp-go"' + (n ? '' : ' disabled') + '>' + I.upload + 'Flytja inn ' + n + ' lög</button></div></div>';
}
function runImport() {
  var list = IMP.filter(function (x) { return x.sel; });
  var btn = app.querySelector('[data-act=imp-go]');
  var done = 0, failed = [];
  app.querySelectorAll('[data-imp]').forEach(function (c) { c.disabled = true; });
  function step() {
    if (done + failed.length >= list.length) {
      var rp = list.filter(function (x) { return x.exists; }).length;
      toast(done + ' lög flutt inn' + (rp ? ' (' + rp + ' skipt út)' : '') + (failed.length ? ', ' + failed.length + ' mistókust' : ''));
      IMP = null;
      return viewBook();
    }
    var x = list[done + failed.length];
    btn.disabled = true;
    btn.textContent = 'Flyt inn ' + (done + failed.length + 1) + ' af ' + list.length + '…';
    D.saveSong(S.pass, { id: x.exists || null, title: x.title, artist: x.artist, body: x.body, song_key: '', capo: 0 }).then(function () {
      done++; step();
    }).catch(function (e) {
      var m = errMsg(e);
      if (m === 'Rangt PIN-númer.') { S.pass = null; SS.set('pass', ''); toast(m); return renderLogin(m); }
      failed.push(x.title); step();
    });
  }
  step();
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var a = b.dataset.act;
  switch (a) {
    case 'reload': location.reload(); break;
    case 'home': setUrl(''); S.q = ''; viewStart(); break;
    case 'drawer': S.q = ''; openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-sheet': closeSheet(); break;
    case 'dtab': S.drawerTab = b.dataset.tab; renderDrawer(); break;
    case 'pick':
      closeDrawer();
      if (S.view === 'host') hostGo(b.dataset.id);
      else { S.cur = b.dataset.id; S.follow = S.cur === S.hostSong; setScroll(0); renderSing(); window.scrollTo(0, 0); }
      break;
    case 'follow': S.follow = true; S.cur = S.hostSong; setScroll(0); renderSing(); window.scrollTo(0, 0); break;
    case 'scroll': setScroll((SCR.v + 1) % 4); break;
    case 'sort': S.sort = S.sort === 'abc' ? 'order' : 'abc'; LS.set('sort', S.sort); renderDrawer(); break;
    case 'chords':
      S.chords = !S.chords;
      LS.set(S.view === 'host' ? 'chords.host' : 'chords.sing', S.chords);
      var y = window.scrollY;
      if (S.view === 'host') renderHost(); else renderSing();
      window.scrollTo(0, y);
      break;
    case 'prev': var i = S.setlist.indexOf(S.cur); if (i > 0) hostGo(S.setlist[i - 1]); break;
    case 'next': var k = S.setlist.indexOf(S.cur); if (k < S.setlist.length - 1) hostGo(S.setlist[k + 1]); break;
    case 'tr': hostTr(+b.dataset.d); break;
    case 'qr': showQR(); break;
    case 'settings': openSettings(); break;
    case 'fs': LS.set('fs', +b.dataset.v); setFs(); openSettings(); break;
    case 'theme': LS.set('theme', b.dataset.v); applyTheme(); openSettings(); break;
    case 'end':
      if (!confirm('Ljúka partýinu? Símarnir hætta að fylgja þér.')) return;
      closeSheet();
      if (S.unlive) { S.unlive(); S.unlive = null; }
      LS.del('host'); S.code = null; S.token = null;
      setUrl(''); viewStart();
      break;
    case 'resume': var h = LS.get('host', {}); setUrl('h=' + h.code); resumeHost(h.code); break;
    case 'join':
      var inp = b.parentElement.querySelector('[data-inp=code]') || app.querySelector('[data-inp=code]');
      var c = (inp && inp.value || '').toUpperCase().replace(/[^A-Z]/g, '');
      if (c.length !== 4) { toast('Kóðinn er fjórir stafir'); if (inp) inp.focus(); return; }
      joinParty(c);
      break;
    case 'rejoin': joinParty(S.code || params.get('k')); break;
    case 'selall':
      var vis = viewList(S.book);
      var allSel = vis.length && vis.every(function (s) { return S.sel.has(s.id); });
      vis.forEach(function (s) { if (allSel) S.sel.delete(s.id); else S.sel.add(s.id); });
      LS.set('sel', Array.from(S.sel)); renderStart();
      break;
    case 'langf':
      S.langf = b.dataset.v; LS.set('langf', S.langf);
      if (drawer.classList.contains('open')) renderDrawer(); else if (S.view === 'start') renderStart();
      break;
    case 'sortv':
      S.sort = b.dataset.v; LS.set('sort', S.sort);
      if (S.view === 'start') renderStart();
      break;
    case 'booksort': openBookSort(); break;
    case 'booksort-do': bookSortDo(b.dataset.v); break;
    case 'start': startParty(); break;
    case 'print': viewPrint(); break;
    case 'doprint': window.print(); break;
    case 'book': S.q = ''; setUrl('bok'); viewBook(); break;
    case 'book-back':
      if (ED && ED.dirty && !confirm('Henda breytingum?')) return;
      ED = null; renderBook();
      break;
    case 'new': renderEdit(null); break;
    case 'import': renderImport(); break;
    case 'imp-back': IMP = null; renderBook(); break;
    case 'imp-all':
      var allSel = IMP.every(function (x) { return x.sel; });
      IMP.forEach(function (x) { x.sel = !allSel; }); renderImportList();
      break;
    case 'imp-prev': e.preventDefault(); var it = IMP[+b.dataset.i]; it.open = !it.open; renderImportList(); break;
    case 'imp-go': runImport(); break;
    case 'edit': renderEdit(b.dataset.id); break;
    case 'mv': moveSong(b.dataset.id, +b.dataset.d); break;
    case 'save': saveSong(); break;
    case 'del':
      if (!confirm('Eyða „' + ED.title + '“ úr söngbókinni?')) return;
      D.deleteSong(S.pass, ED.id).then(function () { toast('Lagi eytt'); ED = null; viewBook(); }).catch(function (er) { toast(errMsg(er)); });
      break;
    case 'convert': convertBody(); toast('Hljómum breytt'); break;
    case 'pchords': ED.chords = !ED.chords; b.classList.toggle('on', ED.chords); updatePreview(); break;
    case 'etab':
      app.querySelector('.editgrid').dataset.tab = b.dataset.tab;
      app.querySelectorAll('.mtabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      break;
  }
});

  if (t.dataset.imp !== undefined && IMP) {
    IMP[+t.dataset.imp].sel = t.checked;
    var tg = app.querySelector('[data-ex="' + t.dataset.imp + '"]'); if (tg) tg.textContent = t.checked ? 'Skipt út' : 'Er þegar til';
    var nn = IMP.filter(function (x) { return x.sel; }).length;
    var gb = app.querySelector('[data-act=imp-go]'); if (gb) { gb.disabled = !nn; gb.innerHTML = I.upload + 'Flytja inn ' + nn + ' lög'; }
    var mh = app.querySelector('.sechead .muted'); if (mh) mh.textContent = nn + ' valin';
  }
  if (t.dataset.ed === 'lang' && ED) { ED.lang = t.value; ED.dirty = true; }
  if (t.dataset.ed === 'capo') { ED.capo = +t.value; ED.dirty = true; updatePreview(); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.ed && ED) { ED[t.dataset.ed] = t.value; ED.dirty = true; clearTimeout(updatePreview._t); updatePreview._t = setTimeout(updatePreview, 120); }
  if (t.dataset.inp === 'code') {
    var v = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (v !== t.value) t.value = v;
  }
  if (t.dataset.inp === 'startq') {
    S.q = t.value; var pos = t.selectionStart; renderStart();
    var s = app.querySelector('[data-inp=startq]'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (er) {}
  }
});
document.addEventListener('paste', function (e) {
  if (e.target.id !== 'f-body') return;
  // Afritað af gitargrip.is / guitarparty.com: hljómarnir eru merktir í HTML-útgáfu klippiborðsins
  var html = e.clipboardData && e.clipboardData.getData('text/html');
  if (html && /data-chord/.test(html) && typeof G.fromChordDom === 'function') {
    var r = G.fromChordDom(new DOMParser().parseFromString(html, 'text/html').body);
    if (r && r.body) {
      e.preventDefault();
      var ta = e.target;
      ta.setRangeText(r.body, ta.selectionStart, ta.selectionEnd, 'end');
      ED.body = ta.value; ED.dirty = true;
      if (r.title && !ED.title) { ED.title = r.title; document.getElementById('f-title').value = r.title; }
      if (r.artist && !ED.artist) { ED.artist = r.artist; document.getElementById('f-artist').value = r.artist; }
      updatePreview();
      toast('Lagið lesið með hljómunum á réttum stað');
      return;
    }
  }
  setTimeout(function () { if (G.needsConversion(e.target.value)) { convertBody(); toast('Hljómum fyrir ofan texta breytt í hljómasnið'); } }, 0);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeDrawer(); closeSheet(); var q = document.getElementById('qr'); if (q) q.remove(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.inp === 'code') { var jb = e.target.parentElement.querySelector('[data-act=join]'); if (jb) jb.click(); }
  if (S.view !== 'host' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  // Örvar og fótstig (síðuflettarar senda oft örvalykla)
  if (e.key === 'ArrowRight') { e.preventDefault(); app.querySelector('[data-act=next]').click(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); app.querySelector('[data-act=prev]').click(); }
  if (e.key === 's' || e.key === 'S') setScroll((SCR.v + 1) % 4);
  if (e.key === 'l' || e.key === 'L') { S.q = ''; openDrawer(); }
});
document.addEventListener('submit', function (e) {
  if (e.target.dataset.form !== 'login') return;
  e.preventDefault();
  var p = e.target.pass.value;
  var btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Athuga…';
  D.check(p).then(function (ok) {
    if (!ok) return renderLogin('Rangt PIN-númer.');
    S.pass = p; SS.set('pass', p); viewBook();
  }).catch(function (er) { renderLogin(errMsg(er)); });
});
window.addEventListener('beforeunload', function (e) { if (S.view === 'edit' && ED && ED.dirty) { e.preventDefault(); e.returnValue = ''; } });

// ================= Ræsing =================
if (!D) {
  app.innerHTML = '<div class="center"><h2>Vantar stillingar</h2><p>Settu Supabase-slóð og lykil í <code>config.js</code> (sama skrá og fyrir Pöbbkvissið).</p></div>';
} else if (params.get('k')) joinParty(params.get('k'));
else if (params.get('h')) resumeHost(params.get('h').toUpperCase());
else if (params.has('bok')) viewBook();
else viewStart();
})();
</script>
</body>
</html>
