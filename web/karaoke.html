<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1f29">
<title>Hljómey Karaoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026-10-19h">
<style>
  :root { --mic: #6fc4dc; }
  body { min-height: 100dvh; }
  input[type=search] { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; -webkit-appearance: none; appearance: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .hint { color: var(--muted); padding: 18px 4px; text-align: center; font-size: 15px; }
  .hint.bad { color: #ffb3bb; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #173d2a; color: #d6ffe6; border: 1px solid #2c6b4a; padding: 11px 16px; border-radius: 12px; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100vw - 32px); text-align: center; }
  .toast.bad { background: #4a1822; color: #ffd7dc; border-color: #7a2533; }
  .center-wrap { max-width: 520px; margin: 0 auto; padding: 8vh 18px 40px; text-align: center; }
  /* Leikjavalmynd efst á upphafssíðu stjórnanda (fellilisti í símum, sjá common.js) */
  .kk-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto; padding: 3vh 4vw 0; }
  .kk-top .brand { font-size: clamp(20px, 2vw, 34px); flex: 0 0 auto; }
  .kk-top ~ .center-wrap { padding-top: 4vh; }
  .modes { display: flex; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; max-width: 100%; min-width: 0; scrollbar-width: none; }
  .modes a { color: var(--muted); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; white-space: nowrap; }
  .modes a:hover { color: var(--text); }
  .modes a.on { background: var(--accent); color: #123647; }
  .center-wrap .brand { font-size: 34px; }
  .center-wrap p { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 18px; text-align: left; }
  .card .btn { width: 100%; }
  .mic-art { width: 92px; height: 92px; margin: 0 auto 14px; display: block; }

  /* ---------- Leit (sameiginleg) ---------- */
  .sform { display: flex; gap: 8px; }
  .sform input { flex: 1; min-width: 0; font-size: 16px; }
  .smodes { display: flex; gap: 6px; margin: 10px 0 4px; overflow-x: auto; scrollbar-width: none; }
  .smodes button { background: var(--bg2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .smodes button.on { background: var(--accent); border-color: var(--accent); color: #123647; font-weight: 500; }
  .sres, .slist { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .song { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .song .row { display: flex; gap: 12px; align-items: flex-start; }
  .thumb { position: relative; flex: 0 0 128px; width: 128px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--bg2); padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.78); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 5px; border-radius: 4px; }
  .song .meta { flex: 1; min-width: 0; }
  .song .meta b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; font-size: 15px; line-height: 1.3; }
  .song .meta small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .acts { display: flex; gap: 8px; margin-top: 10px; }
  .song .acts .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .song.open { border-color: var(--accent); }
  .pv { margin-top: 10px; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .pv:empty { display: none; }
  .pv iframe { width: 100%; height: 100%; border: 0; display: block; }
  .badge-n { color: var(--accent); font-weight: 500; }

  /* ---------- Gestur (sími) ---------- */
  .g { max-width: 600px; margin: 0 auto; padding: 0 14px calc(40px + env(safe-area-inset-bottom)); }
  .g-top { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; padding-top: max(14px, env(safe-area-inset-top)); }
  .g-top .brand { font-size: 20px; flex: 1; }
  .chip { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .chip b { font-weight: 700; letter-spacing: .06em; }
  .now { border-radius: 16px; padding: 14px 16px; background: linear-gradient(135deg, #3a2457, #241b3a); border: 1px solid #4b3a6e; display: flex; gap: 12px; align-items: center; }
  .now .live { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,95,162,.16); color: var(--mic); }
  .now .live .ico { width: 22px; height: 22px; }
  .now small { display: block; color: var(--muted); font-size: 13px; }
  .now b { display: block; font-size: 17px; }
  .now span.t { display: block; font-size: 14px; color: #ddd3f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .tx { min-width: 0; flex: 1; }
  .now.me { background: linear-gradient(135deg, #7a2b5a, #3a2457); border-color: var(--mic); animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(255,95,162,.18); } }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; background: var(--bg); padding: 12px 0 10px; }
  .tabs button { flex: 1; background: var(--bg2); border: 1px solid var(--line); color: var(--muted); border-radius: 12px; padding: 10px 6px; font-weight: 500; font-size: 15px; }
  .tabs button.on { background: var(--card); border-color: var(--accent); color: var(--text); }
  .tabs button i { font-style: normal; color: var(--accent); margin-left: 4px; }
  .qrow { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .qrow .n { flex: 0 0 26px; text-align: center; font-weight: 900; color: var(--muted); font-size: 17px; }
  .qrow .tx { flex: 1; min-width: 0; }
  .qrow .tx b { display: block; font-size: 16px; }
  .qrow .tx small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow.mine { border-color: var(--accent); }
  .qrow.cur { border-color: var(--mic); background: #2f2140; }
  .qrow.cur .n { color: var(--mic); }
  .qrow .x { background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .lfilter { margin-top: 2px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(8,6,14,.72); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; }
  .sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 14px; }
  .sheet .btns .btn { flex: 1; }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px; } }

  /* ---------- Stjórnandi (sjónvarp) ---------- */
  .h { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: minmax(0, 1fr) 64px; }
  .h.wide { grid-template-columns: minmax(0, 1fr) 0; }
  .h.wide .side { display: none; }
  .stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 2.5vh 2vw; min-width: 0; min-height: 0; overflow: hidden; }
  .pwrap { position: relative; width: 100%; max-width: calc((100vh - 64px - 5vh) * 16 / 9); aspect-ratio: 16/9; background: #000; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .h.wide .pwrap { border-radius: 0; }
  .pwrap > #yt, .pwrap > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .onair { position: absolute; left: 16px; bottom: 16px; background: rgba(15,12,24,.82); border: 1px solid rgba(255,95,162,.6); color: #fff; border-radius: 999px; padding: 8px 16px 8px 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: clamp(14px, 1.4vw, 22px); pointer-events: none; transition: opacity .6s; }
  .onair .ico { color: var(--mic); }
  .upnext { position: absolute; right: 16px; top: 16px; background: rgba(15,12,24,.82); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: clamp(12px, 1.1vw, 18px); pointer-events: none; max-width: 40%; }
  .upnext small { color: var(--muted); display: block; font-size: .8em; }
  .upnext b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paused { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,6,14,.55); font-size: clamp(30px, 4vw, 64px); font-weight: 900; pointer-events: none; }
  .scard { text-align: center; max-width: 1100px; }
  .scard .kick { color: var(--muted); font-size: clamp(16px, 1.8vw, 30px); text-transform: uppercase; letter-spacing: .14em; }
  .scard .who { font-size: clamp(48px, 7.5vw, 130px); font-weight: 900; line-height: 1.02; margin: 1vh 0; color: #fff; overflow-wrap: anywhere; }
  .scard .what { font-size: clamp(20px, 2.4vw, 40px); color: #ddd3f2; }
  .scard .cd { width: clamp(90px, 12vh, 150px); aspect-ratio: 1; margin: 4vh auto 2vh; border-radius: 50%; display: grid; place-items: center; font-size: clamp(36px, 6vh, 70px); font-weight: 900; background: conic-gradient(var(--mic) var(--p, 100%), var(--card) 0); position: relative; }
  .scard .cd::before { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--bg); }
  .scard .cd b { position: relative; }
  .scard .row { display: flex; gap: 12px; justify-content: center; margin-top: 2vh; }
  .scard .bigqr { width: min(46vh, 420px); background: #fff; border-radius: 22px; padding: 16px; margin: 3vh auto 2vh; }
  .scard .bigqr svg, .side .qr svg { width: 100%; height: 100%; display: block; }
  .scard .code { font-size: clamp(50px, 7vw, 110px); font-weight: 900; letter-spacing: .1em; color: var(--accent); line-height: 1; }
  .scard .thumbbig { width: min(38vw, 520px); aspect-ratio: 16/9; border-radius: 14px; object-fit: cover; margin-top: 3vh; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: var(--card); }
  .side { border-left: 1px solid var(--line); background: rgba(15,12,24,.55); display: flex; flex-direction: column; min-height: 0; }
  .side .join { display: flex; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }
  .side .qr { width: 104px; height: 104px; background: #fff; border-radius: 12px; padding: 7px; flex: 0 0 104px; }
  .side .join small { color: var(--muted); display: block; font-size: 13px; }
  .side .join b { display: block; font-size: 34px; font-weight: 900; color: var(--accent); letter-spacing: .08em; line-height: 1.1; }
  .side .join span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .side h3 { margin: 0; padding: 14px 16px 8px; font-size: 15px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
  .hq { flex: 1; overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .hq .it { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: var(--card); border: 1px solid transparent; position: relative; }
  .hq .it.cur { border-color: var(--mic); background: #2f2140; }
  .hq .it .n { flex: 0 0 22px; text-align: center; color: var(--muted); font-weight: 700; }
  .hq .it.cur .n { color: var(--mic); }
  .hq .it img { width: 64px; height: 36px; object-fit: cover; border-radius: 5px; flex: 0 0 64px; background: var(--bg2); }
  .hq .it .tx { flex: 1; min-width: 0; }
  .hq .it .tx b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hq .it .tx small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hq .it .ctl { display: none; gap: 2px; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: var(--card); padding-left: 6px; }
  .hq .it:hover .ctl, .hq .it:focus-within .ctl { display: flex; }
  .ib { background: var(--bg2); color: var(--text); width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; }
  .ib:hover { background: var(--line); }
  .hq .empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
  .hbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: rgba(15,12,24,.92); border-top: 1px solid var(--line); }
  .hbar .btn { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .hbar .sp { flex: 1; }
  .hbar .stat { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ov { position: fixed; inset: 0; background: rgba(8,6,14,.75); z-index: 30; display: flex; justify-content: center; align-items: flex-start; padding: 5vh 14px; overflow-y: auto; }
  .ov .box { width: 100%; max-width: 760px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .ov .box header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ov .box header h2 { margin: 0; font-size: 20px; }
  .xbtn { background: none; color: var(--muted); font-size: 28px; width: 40px; height: 40px; border-radius: 10px; }
  .xbtn:hover { background: var(--card); color: var(--text); }
  .set-sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
  .set-sec h3 { margin: 0 0 6px; font-size: 16px; }
  .set-sec p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .set-sec ol { margin: 6px 0 10px; padding-left: 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .set-sec .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .set-sec .row > div { flex: 1 1 200px; }
  .okline { color: var(--good); font-size: 14px; margin-top: 8px; }
  .badline { color: #ffb3bb; font-size: 14px; margin-top: 8px; }
  .libl { max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .libl div { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .libl div span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) {
    .h { grid-template-columns: minmax(0, 1fr) 280px; }
    .hbar .lbl { display: none; }
  }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<main id="app"></main>
<div class="toast hidden" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js?v=2026-10-23a"></script>
<script src="karaoke.js?v=2026-10-23a"></script>
</body>
</html>
